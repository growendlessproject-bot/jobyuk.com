<svg width="185" height="40" viewBox="0 0 185 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jyLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="jyLimeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9F99D" />
      <stop offset="100%" stop-color="#C0F26F" />
    </linearGradient>
  </defs>

  <!-- JobyUK Emblem (36x36 at x=0, y=2) -->
  <g transform="translate(0, 2) scale(0.0703125)">
    <!-- Base Rounded Square with subtle border -->
    <rect x="0" y="0" width="512" height="512" rx="136" fill="url(#jyLogoGrad)" />
    <rect x="8" y="8" width="496" height="496" rx="128" fill="none" stroke="#34D399" stroke-opacity="0.3" stroke-width="12" />

    <!-- Bold Modern J Letterform -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 145 H330" stroke-width="46" />
      <path d="M285 145 V295 C285 360 235 385 180 375 C140 365 125 320 130 275" stroke-width="46" />
    </g>

    <!-- Upward Career / Discovery Starburst Dot -->
    <circle cx="330" cy="145" r="34" fill="url(#jyLimeAccent)" stroke="#FFFFFF" stroke-width="12" />

    <!-- Distinctive UK Sub-Badge in Lower Corner -->
    <rect x="270" y="325" width="165" height="90" rx="30" fill="#064E3B" stroke="#C0F26F" stroke-width="12" />
    <text x="352" y="386" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">UK</text>
  </g>

  <!-- Typography: Joby + UK + .com -->
  <text x="46" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0F5132" letter-spacing="-0.035em">Joby<tspan fill="#059669" font-weight="850">UK</tspan><tspan fill="#587260" font-weight="600" font-size="16.5" letter-spacing="-0.02em">.com</tspan></text>
</svg>
