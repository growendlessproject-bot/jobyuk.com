<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="jyAppIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="jyAppIconLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9F99D" />
      <stop offset="100%" stop-color="#C0F26F" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#jyAppIconGrad)" />
  <rect x="36" y="36" width="440" height="440" rx="112" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="10" />

  <!-- Bold Modern J Letterform -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 145 H330" stroke-width="46" />
    <path d="M285 145 V295 C285 360 235 385 180 375 C140 365 125 320 130 275" stroke-width="46" />
  </g>

  <!-- Upward Career Starburst Dot -->
  <circle cx="330" cy="145" r="34" fill="url(#jyAppIconLime)" stroke="#FFFFFF" stroke-width="12" />

  <!-- Distinctive UK Sub-Badge in Lower Corner -->
  <rect x="270" y="325" width="165" height="90" rx="30" fill="#064E3B" stroke="#C0F26F" stroke-width="12" />
  <text x="352" y="386" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">UK</text>
</svg>
