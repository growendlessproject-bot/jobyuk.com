      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="jobiesLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0F26F" />
