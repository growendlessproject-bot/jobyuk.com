<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Jobies Support Teal/Emerald Gradient -->
    <linearGradient id="supportBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <!-- Teal Support Badge Gradient -->
    <linearGradient id="supportBadgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <!-- Leaf accent -->
    <linearGradient id="supportLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0F26F" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#supportBgGradient)" />

  <!-- Jobies 'J' Letterform -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 140 H350" stroke-width="44" />
    <path d="M300 140 V300 C300 360 250 380 200 370 C160 360 140 320 145 280" stroke-width="44" />
  </g>

  <!-- Leaf accent -->
  <circle cx="350" cy="140" r="32" fill="url(#supportLeafGrad)" stroke="#FFFFFF" stroke-width="12" />

  <!-- Support Headset Badge -->
  <circle cx="130" cy="380" r="42" fill="url(#supportBadgeGradient)" stroke="#FFFFFF" stroke-width="11" />

  <!-- Headset Inside Badge -->
  <path d="M119 380 A 11 11 0 0 1 141 380" 
        fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <rect x="117" y="376" width="5" height="11" rx="2.5" fill="#FFFFFF" />
  <rect x="138" y="376" width="5" height="11" rx="2.5" fill="#FFFFFF" />
  <path d="M140 384 C140 390 135 392 130 392" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="129" cy="392" r="2.2" fill="#FFFFFF" />
</svg>
