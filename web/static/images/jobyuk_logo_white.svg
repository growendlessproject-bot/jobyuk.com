<svg width="185" height="40" viewBox="0 0 185 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jyLogoWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="jyLimeAccentW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FEE7" />
      <stop offset="100%" stop-color="#C0F26F" />
    </linearGradient>
  </defs>

  <!-- JobyUK Emblem -->
  <g transform="translate(0, 2) scale(0.0703125)">
    <!-- Base Rounded Square -->
    <rect x="0" y="0" width="512" height="512" rx="136" fill="url(#jyLogoWhiteGrad)" />
    <rect x="8" y="8" width="496" height="496" rx="128" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="12" />

    <!-- Bold Modern J Letterform -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 145 H330" stroke-width="46" />
      <path d="M285 145 V295 C285 360 235 385 180 375 C140 365 125 320 130 275" stroke-width="46" />
    </g>

    <!-- Upward Career Starburst Dot -->
    <circle cx="330" cy="145" r="34" fill="url(#jyLimeAccentW)" stroke="#FFFFFF" stroke-width="12" />

    <!-- Distinctive UK Sub-Badge in Lower Corner -->
    <rect x="270" y="325" width="165" height="90" rx="30" fill="#064E3B" stroke="#C0F26F" stroke-width="12" />
    <text x="352" y="386" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">UK</text>
  </g>

  <!-- Typography: White theme -->
  <text x="46" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.035em">Joby<tspan fill="#C0F26F" font-weight="850">UK</tspan><tspan fill="#94A3B8" font-weight="600" font-size="16.5" letter-spacing="-0.02em">.com</tspan></text>
</svg>
