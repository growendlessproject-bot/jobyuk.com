{{define "content"}}
<style>
.wa-login-page-wrap {
    min-height: 80vh;
    min-height: 80dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, #f0fdf4 0%, #f8fafc 70%, #f1f5f9 100%);
}
.wa-login-card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 24px;
    padding: 36px 32px;
    box-shadow: 0 20px 35px -10px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.02);
    position: relative;
    overflow: hidden;
}
.wa-login-accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #10b981 0%, #059669 50%, #0284c7 100%);
}
.wa-login-header {
    text-align: center;
    margin-bottom: 28px;
}
.wa-login-logo-wrap {
    width: 58px;
    height: 58px;
    margin: 0 auto 16px auto;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.2) 100%);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #10b981;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
}
.wa-login-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #065f46;
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 12px;
}
.wa-pulse-dot {
    width: 7px;
    height: 7px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
}
.wa-login-title {
    margin: 0 0 8px 0;
    font-size: 1.45rem;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
}
.wa-login-subtitle {
    margin: 0;
    font-size: 0.85rem;
    color: #64748b;
    line-height: 1.5;
}
.wa-error-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.84rem;
    font-weight: 600;
    margin-bottom: 22px;
}
.wa-form-group {
    margin-bottom: 20px;
}
.wa-form-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    color: #334155;
    margin-bottom: 8px;
}
.wa-form-input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 15px;
    border: 1.5px solid #cbd5e1;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    color: #0f172a;
    outline: none;
    transition: all 0.2s ease;
    background: #ffffff;
}
.wa-form-input:focus {
    border-color: #10b981;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
}
.wa-login-btn {
    width: 100%;
    padding: 14px 20px;
    background: #10b981;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
}
.wa-login-btn:hover {
    background: #059669;
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
}
.wa-login-footer {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #f1f5f9;
    text-align: center;
    font-size: 0.78rem;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
</style>

<div class="wa-login-page-wrap">
    <div class="wa-login-card">
        <div class="wa-login-accent-bar"></div>

        <div class="wa-login-header">
            <div class="wa-login-logo-wrap">
                <!-- WhatsApp Clean Vector Emblem -->
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </div>

            <div class="wa-login-badge">
                <span class="wa-pulse-dot"></span>
                <span>Admin Portal</span>
            </div>

            <h1 class="wa-login-title">WhatsApp Alerts Administration</h1>
            <p class="wa-login-subtitle">
                Sign in to manage WhatsApp job alerts and subscribers
            </p>
        </div>

        {{if .Data.Error}}
        <div class="wa-error-banner">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink: 0;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{.Data.Error}}</span>
        </div>
        {{end}}

        <form method="POST" action="/wa-portal/login">
            <div class="wa-form-group">
                <label class="wa-form-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Admin Username</span>
                </label>
                <input type="text" name="username" class="wa-form-input" placeholder="admin" value="admin" required autofocus>
            </div>

            <div class="wa-form-group">
                <label class="wa-form-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Password</span>
                </label>
                <input type="password" name="passcode" class="wa-form-input" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="wa-login-btn">
                <span>Sign In</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="wa-login-footer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Encrypted Session</span>
        </div>
    </div>
</div>
{{end}}
