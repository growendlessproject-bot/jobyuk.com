{{define "content"}}
<div class="container section animate-fade-in" style="padding: 70px 20px 90px; max-width: 800px; margin: 0 auto; text-align: center;">
    
    <!-- Hero 500 Vector Illustration -->
    <div style="margin-bottom: 24px; display: inline-flex; position: relative;">
        <div style="position: absolute; width: 140px; height: 140px; background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, rgba(239, 68, 68, 0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;"></div>
        
        <svg width="110" height="110" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="position: relative; z-index: 1;">
            <circle cx="60" cy="60" r="54" stroke="#fee2e2" stroke-width="2" stroke-dasharray="6 6" />
            <circle cx="60" cy="60" r="38" stroke="rgba(239, 68, 68, 0.15)" stroke-width="3" />
            <circle cx="60" cy="60" r="24" fill="#ffffff" stroke="#ef4444" stroke-width="4" />
            <path d="M60 48v16" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" />
            <circle cx="60" cy="72" r="2.25" fill="#ef4444" />
        </svg>
    </div>

    <div>
        <span style="display: inline-block; background: rgba(239, 68, 68, 0.1); color: #dc2626; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 14px; border-radius: 20px; margin-bottom: 12px;">
            Error 500 • Server Error
        </span>
        <h1 style="font-size: 2.2rem; font-weight: 800; color: #0f172a; margin-bottom: 12px; line-height: 1.2;">
            Something Went Wrong on Our End
        </h1>
        <p style="color: #64748b; max-width: 540px; margin: 0 auto 32px; font-size: 1.05rem; line-height: 1.6;">
            We've logged this issue and our team has been notified. Please try refreshing the page or explore our active job listings below.
        </p>
    </div>

    <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn--primary" style="display: inline-flex; align-items: center; gap: 8px; padding: 13px 30px; border-radius: 9999px; font-weight: 750; font-size: 0.96rem; text-decoration: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Return to Homepage</span>
        </a>
        <a href="/jobs/" class="btn--outline" style="display: inline-flex; align-items: center; gap: 8px; padding: 13px 30px; border: 1.5px solid #CBD5E1; border-radius: 9999px; font-weight: 750; font-size: 0.96rem; text-decoration: none;">
            <span>Browse All UK Jobs</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="jy-arrow-right"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
    </div>
</div>
{{end}}
