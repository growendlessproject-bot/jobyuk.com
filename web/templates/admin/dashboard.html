{{define "admin_content"}}
<div class="admin-stats-grid">
    <!-- Stat Card 1 (Active Jobs) -->
    <div class="stat-card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: all 0.25s ease; display: flex; justify-content: space-between; align-items: flex-start; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #10b981;"></div>
        <div>
            <span style="font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">Active Vacancies</span>
            <div style="display: flex; align-items: baseline; gap: 8px;">
                <span class="stat-card-val" style="font-size: 2.3rem; font-weight: 800; color: #0f172a; display: block; line-height: 1; letter-spacing: -0.03em;">{{.Data.Stats.ActiveJobs}}</span>
                <span style="font-size: 0.72rem; background: #ecfdf5; color: #047857; padding: 2px 7px; border-radius: 9999px; font-weight: 700; text-transform: uppercase; border: 1px solid #a7f3d0;">Live</span>
            </div>
        </div>
        <div class="stat-card-icon" style="background: #f0fdf4; border: 1px solid #dcfce7; padding: 10px; border-radius: 12px; color: #16a34a; flex-shrink: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 22px; height: 22px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.25c0 .621-.504 1.125-1.125 1.125H4.875A1.125 1.125 0 0 1 3.75 18.375v-4.25m16.5 0a2.25 2.25 0 0 0-1.5-2.122h-13.5A2.25 2.25 0 0 0 3.75 14.15m16.5 0V9.75A2.25 2.25 0 0 0 18 7.5h-3m-3 0H6A2.25 2.25 0 0 0 3.75 9.75v4.4m11.25-6.625V5.625c0-.621-.504-1.125-1.125-1.125H10.875c-.621 0-1.125.504-1.125 1.125v1.625m4.5 0a1.125 1.125 0 0 1-1.125 1.125H10.875A1.125 1.125 0 0 1 9.75 7.5m4.5 0H9.75" />
            </svg>
        </div>
    </div>

    <!-- Stat Card 2 (Expired Jobs) -->
    <div class="stat-card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: all 0.25s ease; display: flex; justify-content: space-between; align-items: flex-start; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #ef4444;"></div>
        <div>
            <span style="font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">Expired Vacancies</span>
            <div style="display: flex; align-items: baseline; gap: 8px;">
                <span class="stat-card-val" style="font-size: 2.3rem; font-weight: 800; color: #0f172a; display: block; line-height: 1; letter-spacing: -0.03em;">{{.Data.Stats.ExpiredJobs}}</span>
                <span style="font-size: 0.72rem; background: #fef2f2; color: #b91c1c; padding: 2px 7px; border-radius: 9999px; font-weight: 700; text-transform: uppercase; border: 1px solid #fecaca;">Closed</span>
            </div>
        </div>
        <div class="stat-card-icon" style="background: #fdf2f2; border: 1px solid #fee2e2; padding: 10px; border-radius: 12px; color: #dc2626; flex-shrink: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 22px; height: 22px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
        </div>
    </div>

    <!-- Stat Card 3 (Total Roles) -->
    <div class="stat-card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: all 0.25s ease; display: flex; justify-content: space-between; align-items: flex-start; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #0284c7;"></div>
        <div>
            <span style="font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">Taxonomy Roles</span>
            <span class="stat-card-val" style="font-size: 2.3rem; font-weight: 800; color: #0f172a; display: block; line-height: 1; letter-spacing: -0.03em;">{{.Data.Stats.TotalRoles}}</span>
        </div>
        <div class="stat-card-icon" style="background: #f0f9ff; border: 1px solid #e0f2fe; padding: 10px; border-radius: 12px; color: #0284c7; flex-shrink: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 22px; height: 22px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z" />
            </svg>
        </div>
    </div>

    <!-- Stat Card 4 (Redirects) -->
    <div class="stat-card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: all 0.25s ease; display: flex; justify-content: space-between; align-items: flex-start; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #8b5cf6;"></div>
        <div>
            <span style="font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">Active Redirects</span>
            <span class="stat-card-val" style="font-size: 2.3rem; font-weight: 800; color: #0f172a; display: block; line-height: 1; letter-spacing: -0.03em;">{{.Data.Stats.TotalRedirects}}</span>
        </div>
        <div class="stat-card-icon" style="background: #faf5ff; border: 1px solid #f3e8ff; padding: 10px; border-radius: 12px; color: #8b5cf6; flex-shrink: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 22px; height: 22px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />
            </svg>
        </div>
    </div>
</div>

<!-- Operations Card -->
<div class="admin-ops-card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 28px 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);">
    <h3 style="font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.02em;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px; color: #64748b;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.34 15.84c-.688-.06-1.386-.09-2.09-.09H7.5a4.5 4.5 0 1 1 0-9h.75c.704 0 1.402-.03 2.09-.09m0 9.18c.253.962.584 1.892.985 2.783.247.55.06 1.21-.463 1.511l-.357.205a1.125 1.125 0 0 1-1.4-.205l-1.91-1.91a1.125 1.125 0 0 1-.26-1.06l.353-1.324c.05-.186.098-.372.146-.558m4.89 0c.59-.06 1.176-.14 1.758-.243m-1.758-.12c.253-.962.584-1.893.985-2.784.247-.55.061-1.21-.463-1.511l-.357-.205a1.125 1.125 0 0 0-1.4.205l-1.91 1.91a1.125 1.125 0 0 0-.26 1.06l.353 1.324c.05.186.098.372.146.558m1.2-4.103c.582-.102 1.168-.182 1.758-.243m0 0a20.505 20.505 0 0 1 1.96.963c.49.256.786.764.786 1.317v2.25c0 .553-.297 1.06-.786 1.317a20.468 20.468 0 0 1-1.96.963M16.5 12h-9.75" />
        </svg>
        System Operations
    </h3>
    
    <div class="admin-ops-buttons" style="display: flex; gap: 12px; flex-wrap: wrap;">
        <form method="POST" action="/admin-lol/settings/sync" style="margin: 0; flex: 1; min-width: 180px;">
            <button type="submit" class="btn btn--primary" style="width: 100%; font-weight: 700; padding: 12px 18px; background: #0f172a; color: #ffffff; border: none; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.88rem;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                Trigger Reed API Sync
            </button>
        </form>
        <form method="POST" action="/admin-lol/settings/cache-clear" style="margin: 0; flex: 1; min-width: 160px;">
            <button type="submit" class="btn btn--outline" style="width: 100%; font-weight: 700; padding: 12px 18px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.88rem;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 16px; height: 16px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5m8.25-3v1.5m0 0v.375m0-1.875a3.375 3.375 0 0 0-3.375 3.375h1.5a1.125 1.125 0 0 1 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125h-1.5m1.5 0a1.125 1.125 0 0 1 1.125 1.125v1.5m0-3h1.5m-1.5 3h1.5m-7.5 0h12" />
                </svg>
                Clear Redis Cache
            </button>
        </form>
        <form method="POST" action="/admin-lol/settings/sitemap-rebuild" style="margin: 0; flex: 1; min-width: 180px;">
            <button type="submit" class="btn btn--outline" style="width: 100%; font-weight: 700; padding: 12px 18px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.88rem;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 16px; height: 16px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-.778.099-1.533.284-2.253" />
                </svg>
                Rebuild Sitemap Index
            </button>
        </form>
    </div>
</div>

<style>
.admin-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
}
.stat-card:hover {
    border-color: #cbd5e1 !important;
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05) !important;
}
@media (max-width: 767px) {
    .admin-stats-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
        margin-bottom: 18px !important;
    }
    .stat-card {
        padding: 16px 12px !important;
        border-radius: 16px !important;
    }
    .stat-card-val {
        font-size: 1.55rem !important;
    }
    .stat-card-icon {
        display: none !important;
    }
    .admin-ops-card {
        padding: 20px 16px !important;
    }
    .admin-ops-buttons {
        flex-direction: column !important;
        gap: 10px !important;
    }
    .admin-ops-buttons form {
        min-width: 100% !important;
    }
}
@media (max-width: 360px) {
    .admin-stats-grid {
        grid-template-columns: 1fr !important;
    }
}
</style>
{{end}}
