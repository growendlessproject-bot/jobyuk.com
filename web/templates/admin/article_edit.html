{{define "admin_content"}}
<div class="admin-form-card" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 28px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); max-width: 800px; margin: 0 auto;">
    
    <h3 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 0; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 14px; display: flex; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        <span>{{if .Data.Article.ID}}Edit Career Advice Article{{else}}Create Career Advice Article{{end}}</span>
    </h3>

    <form method="POST" action="{{if .Data.Article.ID}}/admin-lol/content/articles/{{.Data.Article.ID}}{{else}}/admin-lol/content/articles{{end}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        {{if .Data.Article.ID}}
            <input type="hidden" name="_method" value="PUT" />
        {{end}}

        <!-- Form fields -->
        <div class="admin-article-grid-2" style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px;">Article Title <span style="color: #ef4444;">*</span></label>
                <input type="text" name="title" value="{{.Data.Article.Title}}" required placeholder="e.g. How to Write a CV" style="width: 100%; padding: 10px 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; color: #0f172a; outline: none; font-size: 0.9rem; box-sizing: border-box;" />
            </div>
            <div>
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px;">Category</label>
                <select name="category" style="width: 100%; padding: 10px 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; color: #0f172a; outline: none; font-size: 0.9rem; box-sizing: border-box;">
                    <option value="cv" {{if eq .Data.Article.Category "cv"}}selected{{end}}>CV & Cover Letters</option>
                    <option value="interviews" {{if eq .Data.Article.Category "interviews"}}selected{{end}}>Interviews</option>
                    <option value="career-paths" {{if eq .Data.Article.Category "career-paths"}}selected{{end}}>Career Paths</option>
                </select>
            </div>
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px;">URL Slug (auto-generates if empty)</label>
            <input type="text" name="slug" value="{{.Data.Article.Slug}}" placeholder="e.g. write-good-cv" style="width: 100%; padding: 10px 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; color: #0f172a; outline: none; font-size: 0.9rem; box-sizing: border-box;" />
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px;">Article Body (HTML content supported) <span style="color: #ef4444;">*</span></label>
            <textarea name="content" required placeholder="Write article content here..." style="width: 100%; min-height: 220px; padding: 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; color: #0f172a; outline: none; font-family: inherit; resize: vertical; line-height: 1.5; font-size: 0.9rem; box-sizing: border-box;">{{.Data.Article.Content}}</textarea>
        </div>

        <!-- SEO Overrides -->
        <h4 style="font-size: 1rem; font-weight: 800; color: #334155; margin: 20px 0 14px 0; border-top: 1px solid #e2e8f0; padding-top: 18px; display: flex; align-items: center; gap: 6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>SEO Meta Overrides</span>
        </h4>
        
        <div style="margin-bottom: 14px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px;">SEO Page Title</label>
            <input type="text" name="seo_title" value="{{.Data.Article.SEOTitle}}" placeholder="e.g. Tips to Write an Outstanding CV | JobyUK.com" style="width: 100%; padding: 10px 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; color: #0f172a; outline: none; font-size: 0.9rem; box-sizing: border-box;" />
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px;">SEO Page Description</label>
            <textarea name="seo_description" placeholder="Write page meta description..." style="width: 100%; min-height: 75px; padding: 10px 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; color: #0f172a; outline: none; resize: vertical; font-size: 0.9rem; font-family: inherit; box-sizing: border-box;">{{.Data.Article.SEODescription}}</textarea>
        </div>

        <div style="margin-bottom: 24px; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="published" name="published" value="true" {{if .Data.Article.Published}}checked{{end}} style="width: 17px; height: 17px; cursor: pointer;" />
            <label for="published" style="font-weight: 700; font-size: 0.88rem; color: #334155; cursor: pointer; user-select: none;">Publish immediately (show live on site)</label>
        </div>

        <!-- Buttons -->
        <div class="admin-article-actions" style="display: flex; gap: 10px; border-top: 1px solid #e2e8f0; padding-top: 18px;">
            <a href="/admin-lol/content" class="btn btn--outline" style="padding: 10px 20px; border: 1px solid #cbd5e1; color: #0f172a; border-radius: 10px; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.88rem; background: #ffffff;">Cancel</a>
            <button type="submit" class="btn btn--primary" style="flex: 1; padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 0.88rem; cursor: pointer;">Save Article</button>
        </div>
    </form>
</div>

<style>
input:focus, select:focus, textarea:focus {
    border-color: #0284c7 !important;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
}
.btn--primary:hover {
    background: #0369a1 !important;
}
.btn--outline:hover {
    background: #f8fafc !important;
}
@media (max-width: 767px) {
    .admin-form-card {
        padding: 20px 16px !important;
    }
    .admin-article-grid-2 {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
    }
    .admin-article-actions {
        flex-direction: column-reverse !important;
    }
    .admin-article-actions a,
    .admin-article-actions button {
        width: 100% !important;
        text-align: center !important;
    }
}
</style>
{{end}}
