{{define "anti_adblock"}}
{{if antiAdblockEnabled}}
<!-- ================================================================= -->
<!-- Advanced Enterprise Anti-Adblocker Wall (JobyUK Emerald & Lime)   -->
<!-- High-Level Brand Theme: Emerald (#0F5132) & Spring Lime (#C0F26F) -->
<!-- ================================================================= -->
<style id="anti-adblock-styles">
    /* Content Blur & Full Viewport Lockdown when AdBlock is Active */
    html.adblock-active,
    body.adblock-active {
        overflow: hidden !important;
        height: 100vh !important;
        max-height: 100vh !important;
        position: fixed !important;
        width: 100% !important;
    }

    html.adblock-active #main-content,
    html.adblock-active .header,
    html.adblock-active .jy-header-sticky-wrap,
    html.adblock-active footer {
        filter: blur(14px) grayscale(30%) !important;
        pointer-events: none !important;
        user-select: none !important;
        opacity: 0.3 !important;
        transition: filter 0.3s ease, opacity 0.3s ease !important;
    }

    /* Modal Backdrop - Soft Frosted Glass */
    .aab-backdrop {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: rgba(11, 31, 26, 0.45) !important;
        backdrop-filter: blur(12px) saturate(140%) !important;
        -webkit-backdrop-filter: blur(12px) saturate(140%) !important;
        z-index: 2147483647 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 24px !important;
        box-sizing: border-box !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        animation: aabFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }

    @keyframes aabFadeIn {
        from { opacity: 0; transform: scale(0.96) translateY(8px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Main Modal Card - Pure White Executive Finish */
    .aab-card {
        background: #ffffff !important;
        border: 1px solid rgba(15, 81, 50, 0.12) !important;
        box-shadow: 0 25px 60px -15px rgba(11, 31, 26, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(192, 242, 111, 0.15) !important;
        border-radius: 24px !important;
        max-width: 560px !important;
        width: 100% !important;
        padding: 38px 36px 32px !important;
        text-align: center !important;
        color: #0b1f1a !important;
        position: relative !important;
        box-sizing: border-box !important;
    }

    /* Brand Emerald & Lime Shield Icon */
    .aab-icon-wrap {
        width: 72px !important;
        height: 72px !important;
        margin: 0 auto 18px !important;
        border-radius: 50% !important;
        background: linear-gradient(135deg, #ebf9d4 0%, #d8f5a8 100%) !important;
        border: 3px solid #c0f26f !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        color: #0f5132 !important;
        box-shadow: 0 10px 24px -4px rgba(15, 81, 50, 0.18), 0 0 0 6px rgba(192, 242, 111, 0.35) !important;
        animation: aabPulse 2.8s ease-in-out infinite !important;
    }

    @keyframes aabPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 24px -4px rgba(15, 81, 50, 0.18), 0 0 0 6px rgba(192, 242, 111, 0.35); }
        50% { transform: scale(1.05); box-shadow: 0 14px 30px -4px rgba(15, 81, 50, 0.28), 0 0 0 10px rgba(192, 242, 111, 0.45); }
    }

    .aab-title {
        font-size: 26px !important;
        font-weight: 800 !important;
        line-height: 1.25 !important;
        margin: 0 0 10px !important;
        letter-spacing: -0.025em !important;
        color: #0b1f1a !important;
    }

    .aab-subtitle {
        font-size: 14.5px !important;
        line-height: 1.6 !important;
        color: #475569 !important;
        margin: 0 0 24px !important;
    }

    .aab-subtitle strong {
        color: #0f5132 !important;
        font-weight: 700 !important;
    }

    /* Steps Box - Clean Soft Tint */
    .aab-steps-box {
        background: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 16px !important;
        padding: 18px 20px !important;
        margin-bottom: 24px !important;
        text-align: left !important;
    }

    .aab-steps-header {
        font-size: 12px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.08em !important;
        color: #0f5132 !important;
        margin-bottom: 12px !important;
        display: flex !important;
        align-items: center !important;
        gap: 6px !important;
    }

    .aab-steps-list {
        list-style: none !important;
        margin: 0 !important;
        padding: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 10px !important;
    }

    .aab-step-item {
        display: flex !important;
        align-items: flex-start !important;
        gap: 12px !important;
        font-size: 13.5px !important;
        line-height: 1.45 !important;
        color: #334155 !important;
    }

    .aab-step-num {
        width: 22px !important;
        height: 22px !important;
        border-radius: 50% !important;
        background: #0f5132 !important;
        color: #c0f26f !important;
        font-weight: 800 !important;
        font-size: 11px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
        margin-top: 1px !important;
    }

    /* Primary Refresh CTA Button - Emerald Gradient with Lime Glow */
    .aab-btn-refresh {
        width: 100% !important;
        padding: 15px 24px !important;
        background: linear-gradient(135deg, #0f5132 0%, #156d43 100%) !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: 14px !important;
        font-size: 15.5px !important;
        font-weight: 700 !important;
        cursor: pointer !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 10px !important;
        box-shadow: 0 10px 25px -4px rgba(15, 81, 50, 0.4) !important;
        transition: all 0.2s ease !important;
        text-decoration: none !important;
    }

    .aab-btn-refresh:hover {
        transform: translateY(-2px) !important;
        box-shadow: 0 14px 30px -4px rgba(15, 81, 50, 0.55) !important;
        background: linear-gradient(135deg, #0a3c24 0%, #0f5132 100%) !important;
    }

    .aab-btn-refresh:active {
        transform: translateY(0) !important;
    }

    .aab-btn-refresh svg {
        transition: transform 0.4s ease !important;
        stroke: #c0f26f !important;
    }

    .aab-btn-refresh:hover svg {
        transform: rotate(180deg) !important;
    }

    /* Whitelist Helper Pills in STRICT SINGLE ROW */
    .aab-pills-row {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        gap: 8px !important;
        margin-top: 20px !important;
        flex-wrap: nowrap !important;
        width: 100% !important;
        box-sizing: border-box !important;
    }

    .aab-pill {
        display: inline-flex !important;
        align-items: center !important;
        gap: 6px !important;
        font-size: 12px !important;
        color: #334155 !important;
        background: #f8fafc !important;
        padding: 7px 12px !important;
        border-radius: 9999px !important;
        border: 1px solid #e2e8f0 !important;
        font-weight: 600 !important;
        white-space: nowrap !important;
        flex: 1 1 0 !important;
        justify-content: center !important;
        box-shadow: 0 1px 2px rgba(0,0,0,0.03) !important;
        transition: transform 0.15s ease, border-color 0.15s ease !important;
    }

    .aab-pill:hover {
        transform: translateY(-1px) !important;
        border-color: #cbd5e1 !important;
        background: #ffffff !important;
    }

    .aab-pill svg {
        flex-shrink: 0 !important;
    }

    /* Bait hidden element */
    .ad-banner-bait,
    .adsbygoogle-bait {
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        pointer-events: none !important;
    }
</style>

<!-- Hidden DOM Bait Element to trigger AdBlock cosmetic rule filtering -->
<div id="ad-banner-bait-box" class="adsbygoogle pub_300x250 pub_728x90 text-ad ad-banner ad-zone sponsor-banner ad-unit" style="position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px;" aria-hidden="true"></div>

<script>
(function() {
    'use strict';

    // 1. Desktop Only Gating: Adblock wall is strictly enforced for Desktop/Laptop screens (>= 992px)
    function isDesktopDevice() {
        var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var isNarrowViewport = window.innerWidth < 992;
        return !isMobileUA && !isNarrowViewport;
    }

    var adblockDetected = false;
    var wallInjected = false;
    var observer = null;

    // 2. Multi-Vector Detection Engine
    function checkAdblock(callback) {
        if (!isDesktopDevice()) {
            return; // Safe skip on mobile devices to preserve native PWA experience
        }

        var detectedByBait = false;
        var detectedByNetwork = false;
        var detectedByScript = false;

        // Vector A: DOM Bait Inspection (Detects Cosmetic Filters in uBlock, AdBlock, AdGuard, Brave)
        var bait = document.getElementById('ad-banner-bait-box');
        if (bait) {
            var styles = window.getComputedStyle ? window.getComputedStyle(bait) : null;
            if (
                bait.offsetParent === null ||
                bait.offsetHeight === 0 ||
                bait.offsetWidth === 0 ||
                (styles && (styles.display === 'none' || styles.visibility === 'hidden' || styles.opacity === '0'))
            ) {
                detectedByBait = true;
            }
        } else {
            // Bait element was completely removed from DOM by AdBlocker!
            detectedByBait = true;
        }

        // Vector B: Disabled (WeForAds removed)

        // Vector C: Network Bait Fetch (Detects Network-level Adblockers: PiHole, Brave Shield, DNS blockers)
        var testAdUrl = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
        var req = new Request(testAdUrl, { method: 'HEAD', mode: 'no-cors' });

        fetch(req).then(function(res) {
            // Request succeeded without client abort
            if (detectedByBait || detectedByScript) {
                callback(true);
            }
        }).catch(function(err) {
            // ERR_BLOCKED_BY_CLIENT triggered by Adblocker
            detectedByNetwork = true;
            callback(true);
        });

        // Fast fallback if DOM bait already confirmed AdBlock
        if (detectedByBait || detectedByScript) {
            callback(true);
        }
    }

    // 3. Inject Un-bypassable Wall
    function enforceAdblockWall() {
        if (!isDesktopDevice()) return;

        adblockDetected = true;
        document.documentElement.classList.add('adblock-active');
        document.body.classList.add('adblock-active');

        var existingWall = document.getElementById('anti-adblock-overlay');
        if (!existingWall) {
            var backdrop = document.createElement('div');
            backdrop.id = 'anti-adblock-overlay';
            backdrop.className = 'aab-backdrop';
            backdrop.setAttribute('role', 'alertdialog');
            backdrop.setAttribute('aria-modal', 'true');
            backdrop.setAttribute('aria-labelledby', 'aab-title');

            backdrop.innerHTML = [
                '<div class="aab-card">',
                    '<div class="aab-icon-wrap">',
                        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">',
                            '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>',
                            '<line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>',
                        '</svg>',
                    '</div>',
                    '<h2 id="aab-title" class="aab-title">Ad Blocker Detected</h2>',
                    '<p class="aab-subtitle">',
                        'We noticed you are using an ad blocker. Our job listings, application direct links, and salary guides are <strong>100% free</strong> for jobseekers. To support us and view this content, please disable your ad blocker or whitelist our site.',
                    '</p>',
                    '<div class="aab-steps-box">',
                        '<div class="aab-steps-header">',
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>',
                            'Quick 10-Second Whitelist Steps',
                        '</div>',
                        '<ul class="aab-steps-list">',
                            '<li class="aab-step-item">',
                                '<span class="aab-step-num">1</span>',
                                '<span>Click your <strong>AdBlock / uBlock / Brave Shield</strong> extension icon in your browser toolbar.</span>',
                            '</li>',
                            '<li class="aab-step-item">',
                                '<span class="aab-step-num">2</span>',
                                '<span>Select <strong>"Pause on this site"</strong> or toggle Protection <strong>OFF</strong>.</span>',
                            '</li>',
                            '<li class="aab-step-item">',
                                '<span class="aab-step-num">3</span>',
                                '<span>Click the button below to refresh and instantly access all jobs.</span>',
                            '</li>',
                        '</ul>',
                    '</div>',
                    '<button type="button" class="aab-btn-refresh" id="aab-refresh-btn" onclick="window.location.reload();">',
                        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">',
                            '<path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>',
                        '</svg>',
                        'I have Disabled Adblocker ?" Refresh Page',
                    '</button>',
                    '<div class="aab-pills-row">',
                        '<span class="aab-pill">',
                            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86" fill="#E11D48"/><path d="M9 10.5V8a1 1 0 0 1 2 0v2.5M11 10.5V7a1 1 0 0 1 2 0v3.5M13 10.5V8.5a1 1 0 0 1 2 0v2M15 10.5v1a1 1 0 0 1 2 0v1.5a4 4 0 0 1-4 4h-1a4 4 0 0 1-4-4v-3a1 1 0 0 1 2 0v1" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/></svg>',
                            'AdBlock Plus',
                        '</span>',
                        '<span class="aab-pill">',
                            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" fill="#800000"/><path d="M9 10v3a3 3 0 0 0 6 0v-3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.2" fill="#FFFFFF"/></svg>',
                            'uBlock Origin',
                        '</span>',
                        '<span class="aab-pill">',
                            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3.5v6.2c0 5.3-3.4 10.2-8 11.3-4.6-1.1-8-6-8-11.3V5.5L12 2z" fill="#FB542B"/><path d="M9 9.5l1.5 2L12 9l1.5 2.5 1.5-2v2.5c0 1.7-1.3 3-3 3s-3-1.3-3-3V9.5z" fill="#FFFFFF"/></svg>',
                            'Brave Shields',
                        '</span>',
                        '<span class="aab-pill">',
                            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5.2v6c0 5 3.4 9.7 8 10.8 4.6-1.1 8-5.8 8-10.8v-6L12 2z" fill="#10B981"/><polyline points="8.5 12 11 14.5 16 9.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
                            'AdGuard',
                        '</span>',
                    '</div>',
                '</div>'
            ].join('');

            document.body.appendChild(backdrop);
            wallInjected = true;
        }

        // 4. Anti-Tamper & Anti-Inspect Watchdog (Self-Healing)
        startAntiTamperWatchdog();
    }

    function startAntiTamperWatchdog() {
        if (observer) return;

        if (window.MutationObserver) {
            observer = new MutationObserver(function(mutations) {
                if (adblockDetected && isDesktopDevice()) {
                    var wall = document.getElementById('anti-adblock-overlay');
                    var isClassPresent = document.documentElement.classList.contains('adblock-active') &&
                                         document.body.classList.contains('adblock-active');

                    if (!wall || !isClassPresent) {
                        document.documentElement.classList.add('adblock-active');
                        document.body.classList.add('adblock-active');
                        if (!wall) {
                            enforceAdblockWall();
                        }
                    }
                }
            });

            observer.observe(document.documentElement, { attributes: true, childList: true, subtree: true });
        }

        // Periodic heartbeat watchdog
        setInterval(function() {
            if (adblockDetected && isDesktopDevice()) {
                if (!document.getElementById('anti-adblock-overlay') || !document.body.classList.contains('adblock-active')) {
                    document.documentElement.classList.add('adblock-active');
                    document.body.classList.add('adblock-active');
                    enforceAdblockWall();
                }
            }
        }, 1200);
    }

    // Run verification after DOM is ready + delayed check for async blockers
    function initDetector() {
        if (!isDesktopDevice()) return;

        // Check 1: 500ms after load
        setTimeout(function() {
            checkAdblock(function(isBlocked) {
                if (isBlocked) enforceAdblockWall();
            });
        }, 500);

        // Check 2: 1800ms after load (catches delayed extension hooks)
        setTimeout(function() {
            checkAdblock(function(isBlocked) {
                if (isBlocked) enforceAdblockWall();
            });
        }, 1800);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDetector);
    } else {
        initDetector();
    }
})();
</script>
