{{define "rewarded_interstitial"}}
<!-- ==========================================================================
     JobyUK.com Rewarded Interstitial & Verified Application Routing Modal
     Clean, Smooth, Premium UI with Official Logo & Seamless Mobile UX
     ========================================================================== -->
<div id="JobyUKInterstitialOverlay" class="JobyUK-interstitial-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="JobyUKInterstitialTitle">
    <div class="JobyUK-interstitial-modal" id="JobyUKInterstitialCard">
        
        <!-- Header: Official JobyUK.com Logo & Security / Close -->
        <div class="JobyUK-interstitial__header">
            <div class="JobyUK-brand-pill">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="JobyUK-brand-svg">
                    <rect width="32" height="32" rx="8" fill="url(#JobyUK_modal_logo_grad)" />
                    <path d="M9 8V24M23 8V24M9 16H23" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="23" cy="9" r="2.5" fill="#00D4AA"/>
                    <defs>
                        <linearGradient id="JobyUK_modal_logo_grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#0F5132"/>
                            <stop stop-color="#059669"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="JobyUK-brand-meta">
                    <span class="JobyUK-brand-name">JobyUK<span class="JobyUK-brand-uk">UK</span></span>
                    <span class="JobyUK-brand-subtag">Official Application Gateway</span>
                </div>
            </div>

            <div class="JobyUK-header-right">
                <span class="JobyUK-secure-tag">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span>Verified</span>
                </span>
                <button type="button" class="JobyUK-interstitial__close-btn" id="JobyUKInterstitialCloseBtn" aria-label="Close dialog" onclick="closeJobyUKInterstitial()" title="Close & Return">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Body Content -->
        <div class="JobyUK-interstitial__content">
            
            <!-- Desktop Job Routing Card (Hidden on Mobile) -->
            <div class="JobyUK-routing-card">
                <div class="JobyUK-routing-icon-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <polyline points="17 11 19 13 23 9"></polyline>
                    </svg>
                </div>
                <div class="JobyUK-routing-info">
                    <span class="JobyUK-routing-tag">Direct Application Router</span>
                    <div class="JobyUK-routing-job" id="JobyUKInterstitialJobRole">Job Vacancy</div>
                    <span class="JobyUK-routing-employer" id="JobyUKInterstitialSubtitle">Verified Employer Portal</span>
                </div>
            </div>

            <!-- Clean, Smooth Progress Bar Area -->
            <div class="JobyUK-progress-container">
                <div class="JobyUK-progress-meta">
                    <div class="JobyUK-progress-status">
                        <span class="JobyUK-status-dot"></span>
                        <span id="JobyUKStageText">Securing verified connection...</span>
                    </div>
                    <div class="JobyUK-countdown-pill" id="JobyUKCountdownBadge">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span id="JobyUKSecondsRemaining">10s</span>
                    </div>
                </div>

                <!-- Silky Smooth Progress Track (Hardware Accelerated) -->
                <div class="JobyUK-progress-track">
                    <div class="JobyUK-progress-fill" id="JobyUKProgressFill" style="width: 0%;"></div>
                </div>
            </div>

            <!-- Central High-CPM Ad Slot -->
            <div class="JobyUK-ad-frame">
                <div class="JobyUK-ad-meta-bar">
                    <span class="JobyUK-ad-label">Sponsored Partner</span>
                    <span class="JobyUK-ad-secure-note">Encrypted Redirect</span>
                </div>
                <div class="JobyUK-ad-slot-wrap" id="JobyUKInterstitialAdSlot">
                    <div data-wfa-ad="wfa_1229_incontent_banner" data-wfa-size="300x250"></div>
                </div>
            </div>

            <!-- Clean Bottom CTA Action Area -->
            <div class="JobyUK-interstitial__footer">
                <a href="#" id="JobyUKProceedBtn" class="JobyUK-proceed-btn JobyUK-proceed-btn--disabled" target="_blank" rel="nofollow noopener noreferrer" onclick="onJobyUKProceedClicked(event)">
                    <span class="JobyUK-btn-spinner-wrap" id="JobyUKBtnIcon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="JobyUK-btn-spinner">
                            <line x1="12" y1="2" x2="12" y2="6"></line>
                            <line x1="12" y1="18" x2="12" y2="22"></line>
                            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                            <line x1="2" y1="12" x2="6" y2="12"></line>
                            <line x1="18" y1="12" x2="22" y2="12"></line>
                        </svg>
                    </span>
                    <span id="JobyUKProceedBtnText">Verifying Application (10s)...</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="JobyUK-btn-arrow" style="display:none;">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
                
                <div class="JobyUK-skip-wrap" id="JobyUKSkipWrap" style="opacity: 0; pointer-events: none; transition: opacity 0.25s ease;">
                    <button type="button" class="JobyUK-skip-link" onclick="skipJobyUKInterstitial()" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                        <span>Skip verification & continue immediately</span>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<style id="JobyUK-interstitial-clean-css">
/* Backdrop with Frosted Glassmorphism */
.JobyUK-interstitial-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity 0.22s ease-out;
}
.JobyUK-interstitial-overlay.is-active {
    display: flex;
    opacity: 1;
}

/* Modal Card */
.JobyUK-interstitial-modal {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(10, 102, 194, 0.12);
    width: 100%;
    max-width: 460px;
    max-height: 94vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateY(14px) scale(0.98);
    transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}
.JobyUK-interstitial-overlay.is-active .JobyUK-interstitial-modal {
    transform: translateY(0) scale(1);
}

/* Header */
.JobyUK-interstitial__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
}
.JobyUK-brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
}
.JobyUK-brand-svg {
    border-radius: 7px;
    flex-shrink: 0;
}
.JobyUK-brand-meta {
    display: flex;
    flex-direction: column;
    text-align: left;
}
.JobyUK-brand-name {
    font-size: 1.05rem;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.03em;
    line-height: 1.1;
}
.JobyUK-brand-uk {
    color: #0A66C2;
    margin-left: 1px;
}
.JobyUK-brand-subtag {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #64748b;
}

.JobyUK-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}
.JobyUK-secure-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #0f172a;
    color: #ffffff;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: -0.01em;
}
.JobyUK-interstitial__close-btn {
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    color: #64748b;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
}
.JobyUK-interstitial__close-btn:hover {
    background: #e2e8f0;
    color: #0f172a;
}

/* Content */
.JobyUK-interstitial__content {
    padding: 16px 18px 20px 18px;
    display: flex;
    flex-direction: column;
    text-align: center;
}

/* Desktop Routing Card (Clean & Subtle) */
.JobyUK-routing-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f0f7ff;
    border: 1px solid #bae0fd;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    text-align: left;
}
.JobyUK-routing-icon-box {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid #93cbfb;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.JobyUK-routing-info {
    min-width: 0;
    flex: 1;
}
.JobyUK-routing-tag {
    display: block;
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #0A66C2;
}
.JobyUK-routing-job {
    margin: 1px 0 0 0;
    font-size: 0.92rem;
    font-weight: 800;
    color: #0f172a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
}
.JobyUK-routing-employer {
    display: block;
    font-size: 0.76rem;
    font-weight: 600;
    color: #475569;
}

/* Ultra Smooth Progress Bar Area */
.JobyUK-progress-container {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 11px 13px;
    margin-bottom: 12px;
}
.JobyUK-progress-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}
.JobyUK-progress-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    color: #334155;
}
.JobyUK-status-dot {
    width: 7px;
    height: 7px;
    background: #00D4AA;
    border-radius: 50%;
    display: inline-block;
}
.JobyUK-countdown-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #059669;
    color: #ffffff;
    font-size: 0.76rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
}

/* Buttery Smooth Hardware-Accelerated Progress Track */
.JobyUK-progress-track {
    width: 100%;
    height: 6px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
}
.JobyUK-progress-fill {
    height: 100%;
    width: 0%;
    background: #059669;
    border-radius: 999px;
    will-change: width;
    transform: translateZ(0);
}

/* Ad Frame */
.JobyUK-ad-frame {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 12px;
    padding: 8px 4px;
    margin-bottom: 14px;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}
.JobyUK-ad-meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0 6px 6px 6px;
    font-size: 0.65rem;
    color: #94a3b8;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.JobyUK-ad-secure-note {
    color: #059669;
    background: #ECFDF5;
    padding: 1px 6px;
    border-radius: 4px;
}
.JobyUK-ad-slot-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Clean CTA Footer */
.JobyUK-interstitial__footer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
}
.JobyUK-proceed-btn {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 20px;
    border-radius: 12px;
    font-size: 0.96rem;
    font-weight: 800;
    text-decoration: none;
    box-sizing: border-box;
    transition: all 0.2s ease;
    cursor: pointer;
    letter-spacing: -0.01em;
}
.JobyUK-proceed-btn--disabled {
    background: #f1f5f9 !important;
    border: 1.5px solid #cbd5e1 !important;
    color: #475569 !important;
    pointer-events: none;
    box-shadow: none !important;
}
.JobyUK-proceed-btn--active {
    background: linear-gradient(135deg, #059669 0%, #10B981 100%) !important;
    border: 1.5px solid #059669 !important;
    color: #ffffff !important;
    box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35) !important;
}
.JobyUK-proceed-btn--active:hover {
    background: #047857 !important;
    border-color: #047857 !important;
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(5, 150, 105, 0.45) !important;
}
.JobyUK-btn-spinner-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.JobyUK-btn-spinner {
    animation: JobyUKBtnSpin 1.1s linear infinite;
}
@keyframes JobyUKBtnSpin {
    100% { transform: rotate(360deg); }
}

.JobyUK-skip-link {
    background: none;
    border: none;
    color: #64748b;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    padding: 3px 8px;
    text-decoration: underline;
    transition: color 0.15s ease;
}
.JobyUK-skip-link:hover {
    color: #059669;
}

/* =======================================================
   Mobile Optimizations: Completely Hide Routing Card on Mobile
   ======================================================= */
@media (max-width: 640px) {
    .JobyUK-routing-card {
        display: none !important; /* HIDE ROUTING CARD ON MOBILE */
    }
    .JobyUK-interstitial-modal {
        max-width: 100%;
        border-radius: 18px;
    }
    .JobyUK-interstitial__header {
        padding: 12px 14px;
    }
    .JobyUK-interstitial__content {
        padding: 12px 14px 16px 14px;
    }
    .JobyUK-progress-container {
        padding: 9px 11px;
        margin-bottom: 10px;
    }
    .JobyUK-ad-frame {
        margin-bottom: 10px;
        min-height: 250px;
    }
    .JobyUK-proceed-btn {
        padding: 12px 16px;
        font-size: 0.92rem;
    }
}
</style>

<script id="JobyUK-interstitial-logic">
(function() {
    var TOTAL_COUNTDOWN_SECONDS = 10;
    var SKIP_AVAILABLE_SECONDS = 4;
    var currentTargetURL = '';
    var timerInterval = null;
    var hasCompleted = false;

    window.openJobyUKInterstitial = function(targetURL, roleTitle, employerName) {
        if (!targetURL) return;

        // Session Fast-Track: If user already waited in this tab session for this job, open immediately
        try {
            var sessionKey = 'JobyUK_unlocked_' + encodeURIComponent(targetURL);
            if (sessionStorage.getItem(sessionKey) === '1') {
                window.open(targetURL, '_blank', 'noopener,noreferrer');
                return;
            }
        } catch(e) {}

        currentTargetURL = targetURL;
        hasCompleted = false;

        var overlay = document.getElementById('JobyUKInterstitialOverlay');
        var roleEl = document.getElementById('JobyUKInterstitialJobRole');
        var employerEl = document.getElementById('JobyUKInterstitialSubtitle');
        var fill = document.getElementById('JobyUKProgressFill');
        var secondsEl = document.getElementById('JobyUKSecondsRemaining');
        var stageText = document.getElementById('JobyUKStageText');
        var proceedBtn = document.getElementById('JobyUKProceedBtn');
        var proceedText = document.getElementById('JobyUKProceedBtnText');
        var btnIcon = document.getElementById('JobyUKBtnIcon');
        var skipWrap = document.getElementById('JobyUKSkipWrap');

        if (!overlay) return;

        // Populate Job details for desktop view
        if (roleEl) roleEl.textContent = roleTitle || 'Job Vacancy';
        if (employerEl) {
            employerEl.textContent = employerName ? ('Verified Application Gateway • ' + employerName) : 'Verified Employer Portal';
        }

        // Reset UI States
        if (secondsEl) secondsEl.textContent = TOTAL_COUNTDOWN_SECONDS + 's';
        if (stageText) stageText.textContent = 'Securing verified connection...';

        if (skipWrap) {
            skipWrap.style.opacity = '0';
            skipWrap.style.pointerEvents = 'none';
        }

        if (proceedBtn) {
            proceedBtn.href = currentTargetURL;
            proceedBtn.className = 'JobyUK-proceed-btn JobyUK-proceed-btn--disabled';
            if (proceedText) proceedText.textContent = 'Verifying Application (' + TOTAL_COUNTDOWN_SECONDS + 's)...';
            if (btnIcon) btnIcon.style.display = 'inline-flex';
            var arrow = proceedBtn.querySelector('.JobyUK-btn-arrow');
            if (arrow) arrow.style.display = 'none';
        }

        // Display Modal & Lock Background Scroll
        overlay.classList.add('is-active');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.classList.add('JobyUK-interstitial-open');

        // Request ad refresh for 10-second viewability
        try {
            if (window.wfa && typeof window.wfa.refresh === 'function') {
                window.wfa.refresh();
            } else if (window.googletag && typeof window.googletag.pubads === 'function') {
                var pubads = window.googletag.pubads();
                if (pubads && typeof pubads.refresh === 'function') {
                    pubads.refresh();
                }
            }
        } catch(e) {}

        // BUTTERY SMOOTH PROGRESS ANIMATION:
        // Reset width without transition, then animate continuously via CSS transition over 10 seconds!
        if (fill) {
            fill.style.transition = 'none';
            fill.style.width = '0%';
            // Force reflow
            void fill.offsetWidth;
            // Butter-smooth hardware-accelerated 10-second linear fill
            fill.style.transition = 'width ' + TOTAL_COUNTDOWN_SECONDS + 's linear';
            fill.style.width = '100%';
        }

        var remainingSeconds = TOTAL_COUNTDOWN_SECONDS;
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(function() {
            remainingSeconds -= 1;

            if (secondsEl && remainingSeconds >= 0) {
                secondsEl.textContent = remainingSeconds + 's';
            }

            if (stageText) {
                if (remainingSeconds > 6) {
                    stageText.textContent = 'Securing verified connection...';
                } else if (remainingSeconds > 2) {
                    stageText.textContent = 'Validating application endpoint...';
                } else if (remainingSeconds > 0) {
                    stageText.textContent = 'Redirect connection verified & ready!';
                }
            }

            // Expose Skip Link After 4s
            if (remainingSeconds <= (TOTAL_COUNTDOWN_SECONDS - SKIP_AVAILABLE_SECONDS) && skipWrap) {
                skipWrap.style.opacity = '1';
                skipWrap.style.pointerEvents = 'auto';
            }

            if (proceedText && remainingSeconds > 0) {
                proceedText.textContent = 'Verifying Application (' + remainingSeconds + 's)...';
            }

            // Completed!
            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                hasCompleted = true;
                markRewardedComplete();
            }
        }, 1000);
    };

    function markRewardedComplete() {
        var secondsEl = document.getElementById('JobyUKSecondsRemaining');
        var stageText = document.getElementById('JobyUKStageText');
        var proceedBtn = document.getElementById('JobyUKProceedBtn');
        var proceedText = document.getElementById('JobyUKProceedBtnText');
        var btnIcon = document.getElementById('JobyUKBtnIcon');

        if (secondsEl) secondsEl.textContent = '0s';
        if (stageText) stageText.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><polyline points="20 6 9 17 4 12"></polyline></svg>Verified! Click to apply now.';

        if (proceedBtn) {
            proceedBtn.className = 'JobyUK-proceed-btn JobyUK-proceed-btn--active';
            if (proceedText) proceedText.textContent = 'Continue to Official Application';
            if (btnIcon) btnIcon.style.display = 'none';
            var arrow = proceedBtn.querySelector('.JobyUK-btn-arrow');
            if (arrow) arrow.style.display = 'inline-block';
        }

        try {
            if (currentTargetURL) {
                sessionStorage.setItem('JobyUK_unlocked_' + encodeURIComponent(currentTargetURL), '1');
            }
        } catch(e) {}
    }

    window.closeJobyUKInterstitial = function() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        var overlay = document.getElementById('JobyUKInterstitialOverlay');
        if (overlay) {
            overlay.classList.remove('is-active');
            overlay.setAttribute('aria-hidden', 'true');
        }
        document.body.classList.remove('JobyUK-interstitial-open');
    };

    window.skipJobyUKInterstitial = function() {
        markRewardedComplete();
        if (currentTargetURL) {
            window.open(currentTargetURL, '_blank', 'noopener,noreferrer');
            closeJobyUKInterstitial();
        }
    };

    window.onJobyUKProceedClicked = function(e) {
        if (!hasCompleted) {
            e.preventDefault();
            return;
        }
        closeJobyUKInterstitial();
    };

    // Dedicated Application Gateway Page is now active on /jobs/{id}/apply/.
    // Modal interceptor disabled so users navigate directly to the dedicated gateway page.
    // attachApplyInterceptors disabled.
})();
</script>
