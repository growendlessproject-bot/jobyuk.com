{{define "breadcrumbs"}}
{{if .Breadcrumbs}}
<nav class="jy-breadcrumbs" aria-label="Breadcrumb navigation" style="margin-bottom: 20px; width: 100%;">
    <ol class="jy-breadcrumbs__list" style="display: flex; align-items: center; list-style: none; padding: 0; margin: 0; color: #64748B; flex-wrap: wrap; line-height: 1.5;">
        {{range $i, $crumb := .Breadcrumbs}}
            {{if $i}}
            <li class="jy-breadcrumbs__separator" aria-hidden="true" style="display: inline-flex; align-items: center; color: #94A3B8; margin: 0 2px;">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </li>
            {{end}}
            <li class="jy-breadcrumbs__item" style="display: inline-flex; align-items: center;">
                {{if $crumb.URL}}
                    <a href="{{$crumb.URL}}" class="jy-breadcrumbs__link" style="color: #475569; text-decoration: none; font-weight: 500; transition: color 0.15s ease;" onmouseover="this.style.color='#059669'" onmouseout="this.style.color='#475569'">{{$crumb.Name}}</a>
                {{else}}
                    <span class="jy-breadcrumbs__current" style="color: #059669; font-weight: 700; max-width: 450px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle;" aria-current="page" title="{{$crumb.Name}}">{{$crumb.Name}}</span>
                {{end}}
            </li>
        {{end}}
    </ol>
</nav>
<style>
.jy-breadcrumbs__list {
    font-size: 13.5px;
    gap: 8px;
}
@media (max-width: 640px) {
    .jy-breadcrumbs__list {
        font-size: 12.5px !important;
        gap: 6px !important;
    }
}
</style>
{{end}}
{{end}}
