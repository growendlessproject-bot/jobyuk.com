{{define "whatsapp_channel_fab"}}
{{if whatsappAlertsEnabled}}
<!-- Floating WhatsApp Channel Button (Left Side - Pure Clean WhatsApp Icon + Channel Text Below, No Wrap) -->
<aside class="wa-channel-fab-container" aria-label="Official WhatsApp Channel">
    <a href="https://whatsapp.com/channel/0029Vb9iXUMAu3aQOlanBy2m"
       target="_blank"
       rel="noopener noreferrer"
       class="wa-channel-fab"
       id="JobyUKWaChannelFab"
       title="Join JobyUK.com WhatsApp Channel"
       aria-label="Join official JobyUK.com WhatsApp Channel">
        <div class="wa-channel-fab__icon-wrap">
            <svg class="wa-channel-fab__svg" viewBox="0 0 24 24" width="52" height="52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12.004 0C5.373 0 0 5.373 0 12.004c0 2.12.553 4.11 1.519 5.84L.01 24l6.328-1.474a11.96 11.96 0 0 0 5.666 1.478c6.631 0 12.004-5.373 12.004-12.004C24.008 5.373 18.635 0 12.004 0z" fill="#25D366"/>
                <path d="M17.472 14.382c-.301-.15-1.777-.876-2.052-.976-.275-.1-.475-.15-.675.15-.2.3-.775.976-.95 1.176-.175.2-.35.225-.65.075-.3-.15-1.267-.467-2.413-1.488-.893-.796-1.496-1.78-1.671-2.08-.175-.3-.019-.462.13-.611.136-.134.301-.35.452-.525.15-.175.2-.3.3-.5.1-.2.05-.375-.025-.525-.075-.15-.675-1.625-.925-2.225-.244-.585-.493-.505-.675-.514-.175-.009-.375-.01-.575-.01-.2 0-.525.075-.8.375-.275.3-1.05 1.025-1.05 2.5 0 1.475 1.075 2.9 1.225 3.1.15.2 2.116 3.23 5.125 4.53.716.31 1.275.495 1.71.634.72.228 1.375.196 1.893.119.578-.086 1.777-.726 2.027-1.427.25-.7.25-1.3.175-1.425-.075-.125-.275-.2-.575-.35z" fill="#ffffff"/>
            </svg>
        </div>
        <span class="wa-channel-fab__label">Channel</span>
    </a>
</aside>

<style>
/* WhatsApp Channel Left-Side Floating Position */
.wa-channel-fab-container {
    position: fixed;
    left: 20px;
    bottom: 24px;
    z-index: 9980;
    pointer-events: auto;
}

/* Pure Clean Anchor - Zero Outer Wrapper, Zero Card Borders, Zero Background */
.wa-channel-fab {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: none !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
    text-decoration: none !important;
    outline: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.wa-channel-fab:hover {
    transform: translateY(-3px) scale(1.06);
}

.wa-channel-fab:active {
    transform: scale(0.95);
}

/* Pure WhatsApp Icon */
.wa-channel-fab__icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
    filter: drop-shadow(0 5px 14px rgba(37, 211, 102, 0.42)) drop-shadow(0 2px 5px rgba(0, 0, 0, 0.12));
    transition: filter 0.2s ease;
}

.wa-channel-fab:hover .wa-channel-fab__icon-wrap {
    filter: drop-shadow(0 8px 22px rgba(37, 211, 102, 0.58)) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.16));
}

.wa-channel-fab__svg {
    width: 52px;
    height: 52px;
    display: block;
}

/* Channel Text Below Icon */
.wa-channel-fab__label {
    font-size: 0.72rem;
    font-weight: 700;
    color: #0f172a;
    line-height: 1;
    letter-spacing: 0.01em;
    background: #ffffff;
    padding: 2.5px 7px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    font-family: inherit;
    border: 1px solid rgba(0, 0, 0, 0.05);
    transition: color 0.18s ease;
}

.wa-channel-fab:hover .wa-channel-fab__label {
    color: #059669;
}

/* Mobile Responsive Optimization & Overlap Protection */
@media (max-width: 768px) {
    .wa-channel-fab-container {
        left: 14px;
        bottom: 18px;
    }
    .wa-channel-fab__svg {
        width: 44px;
        height: 44px;
    }
    .wa-channel-fab__label {
        font-size: 0.66rem;
        padding: 2px 6px;
    }

    /* Elevate when mobile sticky bottom bar is present (Job Detail & Listing Pages) */
    body:has(.mobile-job-bottom-bar) .wa-channel-fab-container,
    body.has-job-bottom-bar .wa-channel-fab-container,
    body:has(#sticky-view-mode-bar) .wa-channel-fab-container,
    body:has(.glass-floating-bar) .wa-channel-fab-container,
    body.has-listing-bottom-bar .wa-channel-fab-container {
        bottom: calc(78px + env(safe-area-inset-bottom, 10px)) !important;
    }
}
</style>
<script>
(function() {
    function adjustFabPosition() {
        if (document.querySelector('.mobile-job-bottom-bar')) {
            document.body.classList.add('has-job-bottom-bar');
        }
        if (document.querySelector('#sticky-view-mode-bar') || document.querySelector('.glass-floating-bar')) {
            document.body.classList.add('has-listing-bottom-bar');
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', adjustFabPosition);
    } else {
        adjustFabPosition();
    }
})();
</script>
{{end}}
{{end}}
